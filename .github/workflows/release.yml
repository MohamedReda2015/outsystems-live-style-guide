name: Release

# Push a tag like v2.0.0 to publish a GitHub release with an installable skill archive
# (outsystems-live-style-guide.zip, SKILL.md at the top level: ready for Claude.ai / Claude Desktop upload).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check the tag matches SKILL.md and package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "version: ${TAG}$" SKILL.md || { echo "SKILL.md metadata.version is not ${TAG}"; exit 1; }
          node -e "if (require('./package.json').version !== '${TAG}') { console.error('package.json version is not ${TAG}'); process.exit(1) }"
      - name: Build the skill archive
        run: |
          mkdir -p dist/outsystems-live-style-guide
          cp -r SKILL.md README.md LICENSE THIRD_PARTY_NOTICES.md CHANGELOG.md references templates scripts adapters dist/outsystems-live-style-guide/
          (cd dist && zip -r ../outsystems-live-style-guide.zip outsystems-live-style-guide)
          (cd dist/outsystems-live-style-guide && zip -r ../../outsystems-live-style-guide-flat.zip .)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" outsystems-live-style-guide.zip outsystems-live-style-guide-flat.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
